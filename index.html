<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06C755">
  <title>ミニアプリ</title>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://api.line.me">
  <link rel="stylesheet" href="css/style.css?v=20261007">
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">読み込み中…</h1>
    <img id="avatar" class="avatar" alt="" hidden>
  </header>
  <div id="mock-banner" class="mock-banner" hidden>デモモード：LINEログインなしで動作中（データはこの端末内だけに保存されます）</div>

  <main id="main">
    <section id="tab-card" class="tab" data-tab="card">
      <!-- 初回の読み込み中に表示する骨組み（app.js が本来の内容で置き換えます） -->
      <div class="skeleton" role="status" aria-label="読み込み中">
        <div class="sk sk-card"></div>
        <div class="sk sk-line"></div>
        <div class="panel">
          <div class="sk sk-title"></div>
          <div class="stamp-grid">
            <div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div>
            <div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div><div class="sk sk-dot"></div>
          </div>
          <div class="sk sk-line short"></div>
        </div>
      </div>
    </section>
    <section id="tab-rally" class="tab" data-tab="rally" hidden></section>
    <section id="tab-vote" class="tab" data-tab="vote" hidden></section>
    <section id="tab-reception" class="tab" data-tab="reception" hidden>
      <div id="ticket-panel"></div>
      <div id="reserve-panel"></div>
    </section>
    <section id="tab-link" class="tab" data-tab="link" hidden></section>
  </main>

  <nav class="tabbar" role="tablist" hidden>
    <button data-tab="card" role="tab" class="active" aria-selected="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4M14 13h3"/></svg>
      <span>会員証</span>
    </button>
    <button data-tab="rally" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span>ラリー</span>
    </button>
    <button data-tab="vote" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>投票</span>
    </button>
    <button data-tab="reception" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 5v12" stroke-dasharray="2 2"/></svg>
      <span>受付</span>
    </button>
    <button data-tab="link" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span>ID連携</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="loading" class="loading"><div class="spinner"></div></div>

  <script id="liff-sdk" src="https://static.line-scdn.net/liff/edge/2/sdk.js" async onerror="window.__liffSdkError=true"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- ?v= はファイル更新時に数字を変える（スマホに残った古いファイルと混ざらないようにするため） -->
  <script src="js/config.js?v=20261007"></script>
  <script src="js/ui.js?v=20261007"></script>
  <script src="js/api.js?v=20261007"></script>
  <script src="js/app.js?v=20261007"></script>
</body>
</html>
